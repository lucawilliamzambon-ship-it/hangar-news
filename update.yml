name: Aggiorna notizie
on:
  schedule:
    - cron: "0 */3 * * *"   # ogni 3 ore
  workflow_dispatch: {}      # avvio manuale
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - run: |
          git config user.name "hangar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Aggiorna notizie" && git push)
